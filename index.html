<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DigiVault front-end prototype for digital evidence and chain-of-custody workflows." />
    <title>Login | DigiVault</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-header">
            <img src="assets/digivault-logo.png" alt="DigiVault logo" />
            <div class="login-header-text">
                <span>DigiVault</span>
                <span>Digital Evidence Locker</span>
            </div>
        </div>

        <h1 class="login-title">Secure Login</h1>
        <p class="login-subtitle">
            Front-end prototype demo. Credentials are not validated.
        </p>

        <form action="dashboard.html" method="get">
            <div class="form-field">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" autocomplete="username" />
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" autocomplete="current-password" />
            </div>

            <div class="form-footer">
                <span class="muted-link">Forgot password? (prototype)</span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
    </main>
</body>
</html>
